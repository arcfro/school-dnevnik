services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dnevnik
      POSTGRES_PASSWORD: dnevnik
      POSTGRES_DB: dnevnik
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dnevnik -d dnevnik']
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://dnevnik:dnevnik@db:5432/dnevnik
      NUXT_SESSION_PASSWORD: dev-docker-session-password-min-32-chars
      NUXT_JOB_SECRET: dev-job-secret
      BITRIX_MODE: stub
      BITRIX_ENABLED: 'true'
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
